[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minisgl"
version = "0.1.0"
description = "A scaffold-first teaching repository for understanding and building Mini-SGLang"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.11.0",
    "black>=24.0",
    "mypy>=1.10",
]
model = [
    "accelerate",
    "modelscope",
    "torch<2.10.0",
    "transformers>=4.56.0,<=4.57.3",
]
serve = [
    "fastapi",
    "openai",
    "prompt_toolkit",
    "pyzmq",
    "uvicorn",
]
cuda = [
    "apache-tvm-ffi>=0.1.4",
    "flashinfer-python>=0.5.3",
    "msgpack",
    "quack-kernels",
    "sgl_kernel>=0.3.17.post1",
]

[project.scripts]
minisgl = "minisgl.__main__:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"*" = ["csrc/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "exercise: implementation exercise; skipped unless MINISGL_RUN_EXERCISES=1 or --run-exercises is used",
    "gpu: requires a working CUDA environment",
    "slow: takes noticeably longer than a unit test",
    "integration: crosses several subsystems",
]

[tool.coverage.run]
branch = true
source = ["minisgl"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["minisgl"]

[tool.ruff.lint.per-file-ignores]
# Scaffold signatures intentionally retain optional runtime types such as torch.Tensor.
# Imports stay out of module scope so the teaching package remains dependency-free.
"python/minisgl/**/*.py" = ["F401", "F821"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
